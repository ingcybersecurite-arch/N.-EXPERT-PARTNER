<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Messages reçus — N. Expert Partner</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <img src="/assets/logo.png" alt="N. Expert Partner Consulting" class="admin-logo">
    <div class="admin-header-right">
      <span id="whoami" class="whoami"></span>
      <button id="refreshBtn" class="btn btn-outline-dark btn-sm">Actualiser</button>
      <button id="logoutBtn" class="btn btn-primary btn-sm">Déconnexion</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-toolbar">
      <h1>Messages reçus</h1>
      <div class="counters">
        <span class="pill" id="totalCount">0 message(s)</span>
        <span class="pill pill-unread" id="unreadCount">0 non lu(s)</span>
      </div>
    </div>

    <div id="emptyState" class="empty-state" hidden>
      <p>Aucun message pour le moment. Dès qu'un visiteur écrira depuis le site, il apparaîtra ici.</p>
    </div>

    <div id="messagesList" class="messages-list"></div>
  </main>

  <script src="/admin/admin.js"></script>
</body>
</html>
