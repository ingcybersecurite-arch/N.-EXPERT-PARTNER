<!-- ===== CONTACT ===== -->
<section class="section contact" id="contact">
  <div class="container contact-grid">
    <div class="contact-info">
      

      <ul class="info-list">
        <li>
          <span class="info-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 22s7-7.4 7-13a7 7 0 10-14 0c0 5.6 7 13 7 13z"/><circle cx="12" cy="9" r="2.6"/></svg>
          </span>
          <div>
            <span class="info-label" data-i18n="info_address_label">Adresse</span>
            <span class="info-value" data-i18n="info_address_value">N'Djamena, Tchad</span>
          </div>
        </li>
        <li>
          <span class="info-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.9 15.9 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11 11 0 003.5.56 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11 11 0 00.56 3.5 1 1 0 01-.25 1z"/></svg>
          </span>
          <div>
            <span class="info-label" data-i18n="info_phone_label">Téléphone</span>
            <a class="info-value" href="tel:+235663206061">+235 66 32 06 06</a>
          </div>
        </li>
        <li>
          <span class="info-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3,7 12,13 21,7"/></svg>
          </span>
          <div>
            <span class="info-label" data-i18n="info_email_label">E-mail</span>
            <a class="info-value" href="mailto:n.expertpartner.suarl@gmail.com">n.expertpartner.suarl@gmail.com</a>
          </div>
        </li>
      </ul>

      <div class="map-embed">
        <iframe
          src="https://www.google.com/maps?q=N%27Djamena,+Tchad&output=embed"
          width="100%" height="240" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Localisation N. Expert Partner Consulting">
        </iframe>
      </div>
    </div>

    <form class="contact-form" id="contactForm" novalidate autocomplete="off">
      <div class="form-row">
        <label for="name" data-i18n="form_name">Nom complet</label><span class="required-mark">*</span>
        <input type="text" id="name" name="name" required minlength="2" maxlength="120" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="email" data-i18n="form_email">Adresse e-mail</label><span class="required-mark">*</span>
        <input type="email" id="email" name="email" required maxlength="180" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="phone" data-i18n="form_phone">Téléphone (optionnel)</label>
        <input type="tel" id="phone" name="phone" maxlength="40" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="subject" data-i18n="form_subject">Objet</label><span class="required-mark">*</span>
        <input type="text" id="subject" name="subject" required minlength="3" maxlength="160" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="message" data-i18n="form_message">Votre message</label><span class="required-mark">*</span>
        <textarea id="message" name="message" rows="5" required minlength="20" maxlength="4000" autocomplete="off"></textarea>
      </div>

      <p class="required-note" data-i18n="form_required_note">* Champs obligatoires</p>

      <div class="form-row form-row-checkbox">
        <label class="checkbox-label">
          <input type="checkbox" id="consent" name="consent" required>
          <span>
            <span data-i18n="form_consent_pre">J'accepte que les informations saisies ci-dessus soient utilisées par N. Expert Partner Consulting pour traiter ma demande, conformément à notre</span>
            <a href="/politique-confidentialite.html" target="_blank" rel="noopener noreferrer" data-i18n="form_consent_link">politique de confidentialité</a>.
          </span>
        </label>
      </div>

      <!-- Honeypot anti-bot : champ caché, ne pas remplir -->
      <div class="hp-field" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
        <span data-i18n="form_submit">Envoyer le message</span>
      </button>

      <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
